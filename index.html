<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelixNebula</title>
<meta name="description" content="This is a funny little website that I made">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e8f2;
    --ink: #1b1f3b;
    --muted: #55598a;
    --accent: #2b3fe0;
    --rule: #1b1f3b33;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14162b;
      --ink: #ecebf7;
      --muted: #9fa3d1;
      --accent: #8c9bff;
      --rule: #ecebf733;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.125rem;
    line-height: 1.55;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    min-height: 100vh;
  }
  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.5rem, 6vw, 5rem);
  }
  .content { width: 100%; max-width: 34rem; }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(3rem, 9vw, 6.5rem);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.045em;
  }
  .bio { margin: 0 0 2.5rem; max-width: 30rem; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }
  a.link {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.8rem 0;
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
  }
  a.link span { color: var(--muted); font-weight: 400; }
  a.link:hover, a.link:focus-visible { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Nebula panel. If nebula.jpg is in the same folder it covers everything
     below it; if not, the generated gradient nebula shows instead. */
  .nebula {
    background:
      url("nebula.jpg") center / cover no-repeat,
      radial-gradient(1.5px 1.5px at 18% 22%, #fff, transparent),
      radial-gradient(1px 1px at 72% 14%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 48%, #fff, transparent),
      radial-gradient(1px 1px at 33% 64%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 82%, #fff, transparent),
      radial-gradient(1px 1px at 12% 88%, #fff, transparent),
      radial-gradient(ellipse 60% 45% at 30% 28%, #7b3fe4cc, transparent 70%),
      radial-gradient(ellipse 55% 40% at 72% 58%, #e0408fb3, transparent 70%),
      radial-gradient(ellipse 60% 40% at 38% 88%, #2b6fe0b3, transparent 70%),
      #0a0a1c;
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .nebula { order: -1; min-height: 38vh; }
    main { padding-top: 2rem; }
  }
</style>
</head>
<body>
<div class="layout">
  <main>
    <div class="content">
        <h1>Natalie Decker</h1>
        <p class="bio">whats up im kinda weird i have like 2 thoughts. i like astronomy. also dogs wow. if you give me 12 dollars i would be SO happy</p>
        <ul>
        <li><a class="link" href="mailto:cloudberry.natalie@helixnebula.org">Email <span>cloudberry.natalie@helixnebula.org</span></a></li>
        </ul>
    </div>
  </main>
  <div class="nebula" role="img" aria-label="helixnebula"></div>
</div>
</body>
</html>
